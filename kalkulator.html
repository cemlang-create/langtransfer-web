<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pauschal-Kalkulator (intern)</title>
<style>
  @font-face{ font-family:'Work Sans'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/work-sans-latin-400-normal.woff2') format('woff2'); }
  @font-face{ font-family:'Work Sans'; font-style:normal; font-weight:600; font-display:swap; src:url('fonts/work-sans-latin-600-normal.woff2') format('woff2'); }
  :root{
    --ink:#232320; --paper:#faf9f5; --line:#e1dccf; --moss:#b9862f; --moss-dark:#8c6423; --muted:#6b6a63; --err:#b23b2f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Work Sans',sans-serif;background:var(--paper);color:var(--ink);padding:32px 20px 80px;}
  .card{max-width:640px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px;}
  h1{font-size:1.4rem;margin:0 0 4px;font-weight:700;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:14px;font-weight:600;margin-bottom:5px;}
  input, select{
    width:100%;font-family:inherit;font-size:15px;padding:9px 11px;
    border:1px solid #cfc9b8;border-radius:6px;background:#fff;color:var(--ink);
  }
  input:focus, select:focus{outline:none;border-color:var(--moss);}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stopp{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;}
  .stopp .field{flex:1;margin-bottom:0;}
  .stopp button{
    flex:none;background:transparent;border:1px solid #cfc9b8;border-radius:6px;
    width:38px;height:38px;cursor:pointer;color:var(--err);font-size:18px;line-height:1;
  }
  .link-btn{
    background:none;border:none;color:var(--moss-dark);font-weight:600;font-size:14px;
    cursor:pointer;padding:0;margin:0 0 20px;text-decoration:underline;
  }
  .primary{
    width:100%;background:var(--moss);color:#fff;border:none;border-radius:6px;
    padding:13px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;
  }
  .primary:disabled{opacity:0.5;cursor:default;}
  .status{margin-top:12px;font-size:14px;min-height:1.2em;}
  .status.error{color:var(--err);}
  .status.ok{color:#2f6b45;}
  .ergebnis{display:none;margin-top:26px;border-top:1px solid var(--line);padding-top:20px;}
  .tabelle div{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;}
  .tabelle .titel{font-weight:700;margin-top:10px;}
  .tabelle .total{font-weight:700;font-size:17px;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;}
  .hint{font-size:12.5px;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
<div class="card">
  <h1>Pauschal-Kalkulator</h1>
  <p class="sub">Nur für dich intern – ohne Verfügbarkeitsprüfung, ohne 3-Stunden-Grenze, keine Buchung wird ausgelöst.</p>

  <div id="stopps">
    <div class="stopp">
      <div class="field">
        <label>Stopp 1 (Ziel)</label>
        <input type="text" class="stoppAdresse" placeholder="Straße, Hausnummer, Ort" autocomplete="off">
      </div>
    </div>
  </div>
  <button type="button" class="link-btn" onclick="stoppHinzufuegen()">+ Weiteren Stopp hinzufügen</button>
  <p class="hint" style="margin-top:-14px;margin-bottom:20px;">Route wird automatisch berechnet als: Basis (Neckarburg 3) → Stopp 1 → Stopp 2 → … → zurück zur Basis.</p>

  <div class="row">
    <div class="field">
      <label for="fahrgastzuschlag">Zuschlag Fahrgäste (€)</label>
      <input type="number" id="fahrgastzuschlag" value="0" min="0" step="1">
    </div>
    <div class="field">
      <label for="standzeit">Standzeit/Wartezeit (Std.)</label>
      <input type="number" id="standzeit" value="0" min="0" step="0.25">
    </div>
  </div>

  <div class="field">
    <label for="stundensatz">Stundensatz für Standzeit (€/Std.)</label>
    <input type="number" id="stundensatz" value="" min="0" step="1" placeholder="z. B. 25">
  </div>

  <div class="field">
    <label style="display:flex; align-items:center; gap:8px; font-weight:400; cursor:pointer;">
      <input type="checkbox" id="nachtzuschlagAn" style="width:17px; height:17px; accent-color:var(--moss);">
      Nachtzuschlag (+15 €) anwenden
    </label>
  </div>

  <div class="row">
    <div class="field">
      <label for="rabatt">Rabatt (€)</label>
      <input type="number" id="rabatt" value="0" min="0" step="1">
    </div>
    <div class="field">
      <label for="sonderzuschlag">Sonderzuschlag (€)</label>
      <input type="number" id="sonderzuschlag" value="0" min="0" step="1">
    </div>
  </div>

  <button class="primary" id="berechnenBtn" onclick="pauschaleBerechnen()">Berechnen</button>
  <div class="status" id="status"></div>

  <div class="ergebnis" id="ergebnis">
    <div class="tabelle" id="tabelle"></div>
  </div>
</div>

<script>
const BASIS_ADRESSE = "Neckarburg 3, 72654 Neckartenzlingen";
const PLZ_NECKARTENZLINGEN = "72654";

function fmt(n){ return n.toLocaleString("de-DE", {minimumFractionDigits:2, maximumFractionDigits:2}); }

function setStatus(msg, cls){
  const el = document.getElementById("status");
  el.textContent = msg || "";
  el.className = "status" + (cls ? " " + cls : "");
}

function stoppHinzufuegen(){
  const container = document.getElementById("stopps");
  const n = container.children.length + 1;
  const div = document.createElement("div");
  div.className = "stopp";
  div.innerHTML = `
    <div class="field">
      <label>Stopp ${n}</label>
      <input type="text" class="stoppAdresse" placeholder="Straße, Hausnummer, Ort" autocomplete="off">
    </div>
    <button type="button" onclick="stoppEntfernen(this)" title="Stopp entfernen">×</button>`;
  container.appendChild(div);
  initAutocompleteFuer(div.querySelector(".stoppAdresse"));
}

function stoppEntfernen(btn){
  const container = document.getElementById("stopps");
  if (container.children.length <= 1) return;
  btn.closest(".stopp").remove();
  Array.from(container.querySelectorAll(".stopp")).forEach((row, i) => {
    row.querySelector("label").textContent = "Stopp " + (i + 1) + (i === 0 ? " (Ziel)" : "");
  });
}

const stoppPlaces = new Map();

function initAutocompleteFuer(input){
  const ac = new google.maps.places.Autocomplete(input, {
    componentRestrictions: { country: "de" },
    fields: ["formatted_address", "geometry"]
  });
  ac.addListener("place_changed", () => {
    const place = ac.getPlace();
    stoppPlaces.set(input, (place && place.geometry) ? place.formatted_address : null);
  });
  input.addEventListener("input", () => stoppPlaces.set(input, null));
}

function initAutocomplete(){
  document.querySelectorAll(".stoppAdresse").forEach(initAutocompleteFuer);
}

function strecke(origin, destination){
  return new Promise((resolve, reject) => {
    new google.maps.DistanceMatrixService().getDistanceMatrix({
      origins: [origin], destinations: [destination],
      travelMode: google.maps.TravelMode.DRIVING,
      unitSystem: google.maps.UnitSystem.METRIC
    }, (response, status) => {
      if (status !== "OK") { reject("Distanzberechnung fehlgeschlagen: " + status); return; }
      const el = response.rows[0].elements[0];
      if (el.status !== "OK") { reject("Keine Route gefunden zwischen " + origin + " und " + destination + "."); return; }
      resolve({ km: el.distance.value / 1000, min: el.duration.value / 60 });
    });
  });
}

function anfahrtPreis(km){
  if (km <= 10) return km * 0.75;
  return 10 * 0.75 + (km - 10) * 1.50;
}

async function pauschaleBerechnen(){
  setStatus("", "");
  document.getElementById("ergebnis").style.display = "none";

  const inputs = Array.from(document.querySelectorAll(".stoppAdresse"));
  const adressen = inputs.map(i => {
    const geprueft = stoppPlaces.get(i);
    return geprueft || null;
  });

  if (adressen.some(a => !a)) {
    return setStatus("Bitte jeden Stopp aus der Vorschlagsliste auswählen (nicht nur eintippen).", "error");
  }

  const fahrgastzuschlag = Math.max(0, parseFloat(document.getElementById("fahrgastzuschlag").value || 0));
  const standzeit = Math.max(0, parseFloat(document.getElementById("standzeit").value || 0));
  const stundensatzRaw = document.getElementById("stundensatz").value;
  const stundensatz = stundensatzRaw === "" ? 0 : Math.max(0, parseFloat(stundensatzRaw));
  const nachtzuschlagAn = document.getElementById("nachtzuschlagAn").checked;
  const rabatt = Math.max(0, parseFloat(document.getElementById("rabatt").value || 0));
  const sonderzuschlag = Math.max(0, parseFloat(document.getElementById("sonderzuschlag").value || 0));

  if (standzeit > 0 && stundensatzRaw === "") {
    return setStatus("Bitte einen Stundensatz angeben, wenn Standzeit eingetragen ist.", "error");
  }

  const btn = document.getElementById("berechnenBtn");
  btn.disabled = true;
  setStatus("Strecke wird berechnet …", "");

  try {
    const route = [BASIS_ADRESSE, ...adressen, BASIS_ADRESSE];
    const legs = [];
    for (let i = 0; i < route.length - 1; i++) {
      legs.push(await strecke(route[i], route[i + 1]));
    }

    const ersteLeg = legs[0];
    const restLegs = legs.slice(1);
    const restKm = restLegs.reduce((s, l) => s + l.km, 0);
    const gesamtKm = legs.reduce((s, l) => s + l.km, 0);
    const gesamtMin = legs.reduce((s, l) => s + l.min, 0);

    const ersterPreis = anfahrtPreis(ersteLeg.km);
    const restPreis = restKm * 1.50;
    const kmSumme = Math.ceil(ersterPreis + restPreis) + 1;
    const grundpreis = Math.max(kmSumme, 25);

    const nachtzuschlag = nachtzuschlagAn ? 15 : 0;
    const standzeitkosten = standzeit * stundensatz;

    const gesamt = grundpreis + fahrgastzuschlag + nachtzuschlag + standzeitkosten + sonderzuschlag - rabatt;
    const netto = gesamt / 1.19;
    const mwst = gesamt - netto;

    let r = `<div><span>Gesamtstrecke</span><span>${gesamtKm.toFixed(1)} km</span></div>`;
    r += `<div><span>Reine Fahrzeit (ohne Standzeit)</span><span>${Math.round(gesamtMin)} Min.</span></div>`;
    r += `<div class="titel"><span>Grundpreis (km-basiert)</span><span>${fmt(grundpreis)} €</span></div>`;
    r += `<div><span>Zuschlag Fahrgäste</span><span>${fmt(fahrgastzuschlag)} €</span></div>`;
    r += `<div><span>Nachtzuschlag</span><span>${fmt(nachtzuschlag)} €</span></div>`;
    r += `<div><span>Standzeit (${standzeit} Std. × ${fmt(stundensatz)} €)</span><span>${fmt(standzeitkosten)} €</span></div>`;
    r += `<div><span>Sonderzuschlag</span><span>${fmt(sonderzuschlag)} €</span></div>`;
    r += `<div><span>Rabatt</span><span>-${fmt(rabatt)} €</span></div>`;
    r += `<div class="titel"><span>Endbetrag</span><span></span></div>`;
    r += `<div><span>Nettobetrag</span><span>${fmt(netto)} €</span></div>`;
    r += `<div><span>zzgl. MwSt. 19 %</span><span>${fmt(mwst)} €</span></div>`;
    r += `<div class="total"><span>Gesamtpreis (brutto)</span><span>${fmt(gesamt)} €</span></div>`;

    document.getElementById("tabelle").innerHTML = r;
    document.getElementById("ergebnis").style.display = "block";
    setStatus("", "");
  } catch (err) {
    setStatus(typeof err === "string" ? err : "Berechnung fehlgeschlagen.", "error");
  } finally {
    btn.disabled = false;
  }
}
</script>
<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCP9TfFmRUsTB1MkyNZVxkZKf0uTMyYKTE&libraries=places&callback=initAutocomplete&language=de&region=DE">
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Betriebsportal</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @font-face{ font-family:'Work Sans'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/work-sans-latin-400-normal.woff2') format('woff2'); }
  @font-face{ font-family:'Work Sans'; font-style:normal; font-weight:600; font-display:swap; src:url('fonts/work-sans-latin-600-normal.woff2') format('woff2'); }
  :root{ --ink:#232320; --paper:#faf9f5; --line:#e1dccf; --moss:#b9862f; --moss-dark:#8c6423; --muted:#6b6a63; --err:#b23b2f; --ok:#2f6b45; --side:#f3efe4; }
  *{box-sizing:border-box;}
  html, body{margin:0;min-height:100%;}
  body{font-family:'Work Sans',sans-serif;background:var(--paper);color:var(--ink);font-size:15px;}
  button{font-family:inherit;}
  a{color:var(--moss-dark);}

  /* ---------- Login ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:32px;}
  .login-box h1{font-size:1.3rem;margin:0 0 4px;}
  .login-box p{color:var(--muted);font-size:14px;margin:0 0 22px;}
  label{display:block;font-size:14px;font-weight:600;margin-bottom:5px;}
  input, select{width:100%;font-size:15px;padding:10px 12px;border:1px solid #cfc9b8;border-radius:6px;background:#fff;color:var(--ink);font-family:inherit;}
  input:focus, select:focus{outline:none;border-color:var(--moss);}
  .primary{width:100%;background:var(--moss);color:#fff;border:none;border-radius:6px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:14px;}
  .primary:disabled{opacity:.5;cursor:default;}
  .meldung{margin-top:12px;font-size:14px;min-height:1.2em;white-space:pre-line;}
  .meldung.error{color:var(--err);} .meldung.ok{color:var(--ok);}

  /* ---------- Rahmen ---------- */
  #app{display:none;min-height:100vh;}
  header.kopf{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);}
  .marke{font-weight:600;font-size:1.05rem;}
  .marke small{font-weight:400;color:var(--muted);margin-left:6px;}
  .abmelden{background:none;border:1px solid #cfc9b8;border-radius:6px;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--ink);}
  .layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 57px);}
  nav{background:var(--side);border-right:1px solid var(--line);padding:16px 10px;}
  nav a{display:block;padding:10px 12px;margin-bottom:4px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14.5px;}
  nav a:hover{background:#e9e3d2;}
  nav a.aktiv{background:var(--moss);color:#fff;}
  main{padding:26px 28px 80px;min-width:0;}
  h2.seite{font-size:1.35rem;margin:0 0 6px;}
  .unter{color:var(--muted);margin:0 0 20px;font-size:14px;}
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    nav{display:flex;gap:6px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px 10px;position:sticky;top:57px;z-index:15;}
    nav a{white-space:nowrap;margin:0;}
    main{padding:18px 14px 80px;}
  }

  /* ---------- Übersicht ---------- */
  .karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .karte{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
  .karte:hover{border-color:var(--moss);}
  .karte .zahl{font-size:2rem;font-weight:600;line-height:1.1;}
  .karte .text{color:var(--muted);font-size:13.5px;margin-top:4px;}
  .karte.hervor{border-color:var(--moss);background:#fbf5e6;}
  .aktionen{display:flex;flex-wrap:wrap;gap:10px;}
  .knopf{display:inline-block;background:#fff;border:1px solid #cfc9b8;border-radius:6px;padding:10px 16px;font-size:14.5px;font-weight:600;text-decoration:none;color:var(--ink);cursor:pointer;}
  .knopf:hover{border-color:var(--moss);}
  .knopf.gold{background:var(--moss);border-color:var(--moss);color:#fff;}
  .knopf.rot{color:var(--err);}
  .knopf:disabled{opacity:.5;cursor:default;}

  /* ---------- Liste ---------- */
  .filter{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:14px;}
  @media (max-width:640px){ .filter{grid-template-columns:1fr;} }
  .tabellenrahmen{background:#fff;border:1px solid var(--line);border-radius:8px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th, td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;}
  tbody tr{cursor:pointer;} tbody tr:hover{background:#f6f2e8;}
  tbody tr:last-child td{border-bottom:none;}
  .klein{color:var(--muted);font-size:12.5px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;background:#eee;color:var(--muted);white-space:nowrap;}
  .badge.ok{background:#dcefe3;color:var(--ok);} .badge.warn{background:#f6e7c8;color:var(--moss-dark);} .badge.err{background:#f3d9d4;color:var(--err);} .badge.blau{background:#dde8f5;color:#2d4f7a;}
  .leer{padding:28px;text-align:center;color:var(--muted);}

  /* ---------- Auftrag ---------- */
  .zurueck{display:inline-block;margin-bottom:12px;color:var(--muted);text-decoration:none;font-size:14px;}
  .zurueck:hover{color:var(--ink);}
  .kopfkarte{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin-bottom:14px;line-height:1.7;}
  .werkzeuge{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px;}
  .rahmenkarte{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 22px 10px;margin-top:18px;}
  .rahmenkarte h3{margin:16px 0 0;font-size:1.05rem;}
  iframe.maske{width:100%;border:0;display:block;min-height:480px;background:transparent;}
  iframe.vollbreit{background:#fff;border:1px solid var(--line);border-radius:8px;padding:0;min-height:70vh;}
  .laden{color:var(--muted);padding:20px 0;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <form class="login-box" onsubmit="anmeldenKlick(event)">
    <h1 id="loginTitel">Betriebsportal</h1>
    <p>Bitte mit dem Passwort anmelden.</p>
    <label for="pw">Passwort</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <button class="primary" id="loginBtn" type="submit">Anmelden</button>
    <div class="meldung" id="loginMeldung"></div>
  </form>
</div>

<!-- ===================== PORTAL ===================== -->
<div id="app">
  <header class="kopf">
    <div class="marke"><span id="markeName">Betriebsportal</span><small>Betriebsportal</small></div>
    <button class="abmelden" onclick="abmelden()">Abmelden</button>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
// ===================== KONFIGURATION =====================
// Die Adresse der Cloud Functions kommt beim Instanz-Build aus window.INSTANZ, sonst gilt der Standard.
const BASIS = (window.INSTANZ && window.INSTANZ.technik && window.INSTANZ.technik.functionsBasis) || "https://europe-west1-lang-transfer.cloudfunctions.net";

// ===================== HILFEN =====================
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = (n) => Number(n).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
function zeitText(iso, mitJahr){
  if (!iso) return "–";
  return new Date(iso).toLocaleString("de-DE", Object.assign({ weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }, mitJahr ? { year: "numeric" } : {}));
}
const STATUS = {
  angefragt: { text: "Neue Anfrage", cls: "warn" },
  angebot: { text: "Angebot offen", cls: "blau" },
  bestaetigt: { text: "Bestätigt", cls: "ok" },
  storniert: { text: "Storniert", cls: "err" }
};
const statusBadge = (s) => `<span class="badge ${(STATUS[s] || {}).cls || ""}">${esc((STATUS[s] || {}).text || s)}</span>`;

// ===================== ZUGANG =====================
// Heute: ein gemeinsames Passwort pro Betrieb. Alles Passwortabhängige steckt in diesem Block,
// damit sich später Mitarbeiter-Konten einführen lassen, ohne die Seiten umzubauen.
const Auth = {
  lesen(){ try { return localStorage.getItem("lt_admin_key") || ""; } catch (e) { return ""; } },
  setzen(v){ try { localStorage.setItem("lt_admin_key", v); } catch (e) {} },
  loeschen(){ try { localStorage.removeItem("lt_admin_key"); } catch (e) {} }
};
let portal = { marke: "", module: {} };
let eingeloggt = false;

async function api(name, body){
  const antwort = await fetch(`${BASIS}/${name}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({}, body, { adminKey: Auth.lesen() })) });
  let daten = {};
  try { daten = await antwort.json(); } catch (e) {}
  if (antwort.status === 401) { if (eingeloggt) { eingeloggt = false; abmelden("Die Sitzung ist nicht mehr gültig. Bitte neu anmelden."); } throw new Error("Nicht angemeldet."); }
  if (!antwort.ok) throw new Error(daten.fehler || `Fehler ${antwort.status}`);
  return daten;
}
function loginMeldung(text, cls){ const e = $("loginMeldung"); e.textContent = text || ""; e.className = "meldung" + (cls ? " " + cls : ""); }
function zeigeLogin(text){
  $("app").style.display = "none"; $("login").style.display = "flex";
  loginMeldung(text, text ? "error" : "");
  $("pw").value = ""; $("pw").focus();
}
function abmelden(text){ eingeloggt = false; Auth.loeschen(); zeigeLogin(text); }

async function anmeldenKlick(ev){
  ev.preventDefault();
  const pw = $("pw").value.trim();
  if (!pw) return loginMeldung("Bitte das Passwort eingeben.", "error");
  $("loginBtn").disabled = true; loginMeldung("Wird geprüft …", "");
  Auth.setzen(pw);
  try { await portalStarten(); }
  catch (e) { Auth.loeschen(); loginMeldung(e.message === "Nicht angemeldet." ? "Passwort falsch." : (e.message || "Anmeldung fehlgeschlagen."), "error"); }
  finally { $("loginBtn").disabled = false; }
}
async function portalStarten(){
  const d = await api("portalLogin", {});
  portal = { marke: d.marke, module: d.module || {} };
  document.title = `${d.marke} – Betriebsportal`;
  $("markeName").textContent = d.marke; $("loginTitel").textContent = d.marke;
  eingeloggt = true;
  $("login").style.display = "none"; $("app").style.display = "block";
  navAufbauen();
  route();
}

// ===================== NAVIGATION =====================
const MENUE = [
  { pfad: "uebersicht", text: "Übersicht", modul: null },
  { pfad: "auftraege", text: "Aufträge", modul: "auftraege" },
  { pfad: "neu", text: "Neuer Auftrag", modul: "neuerAuftrag" },
  { pfad: "krankenfahrten", text: "Krankenfahrten", modul: "krankenfahrten" },
  { pfad: "einstellungen", text: "Einstellungen", modul: "einstellungen" }
];
function navAufbauen(){
  $("nav").innerHTML = MENUE.filter((m) => !m.modul || portal.module[m.modul])
    .map((m) => `<a href="#/${m.pfad}" data-pfad="${m.pfad}">${esc(m.text)}</a>`).join("");
}
function aktivMarkieren(abschnitt){
  document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("aktiv", a.dataset.pfad === abschnitt));
}
function hashLesen(){
  const roh = location.hash.replace(/^#\/?/, "");
  const [pfad, abfrage] = roh.split("?");
  return { teile: pfad.split("/").filter(Boolean).map(decodeURIComponent), params: new URLSearchParams(abfrage || "") };
}
let aktuelleAnsicht = 0;   // verwirft späte Antworten, wenn man schon woanders ist
function route(){
  if ($("app").style.display === "none") return;
  const { teile, params } = hashLesen();
  const abschnitt = teile[0] || "uebersicht";
  const sichtbar = (modul) => !modul || portal.module[modul];
  aktuelleAnsicht += 1;
  const meine = aktuelleAnsicht;
  const noch = () => meine === aktuelleAnsicht;
  aktivMarkieren(abschnitt === "auftrag" ? "auftraege" : abschnitt);
  window.scrollTo(0, 0);
  if (abschnitt === "auftraege" && sichtbar("auftraege")) return ansichtAuftraege(params, noch);
  if (abschnitt === "auftrag" && teile[1] && sichtbar("auftraege")) return ansichtAuftrag(teile[1], noch);
  if (abschnitt === "neu" && sichtbar("neuerAuftrag")) return ansichtRahmen("Neuer Auftrag", "Preis berechnen und Angebot oder Auftrag an den Kunden senden.", "kalkulator2.html?embedded=1", true);
  if (abschnitt === "krankenfahrten" && sichtbar("krankenfahrten")) return ansichtRahmen("Krankenfahrten", "Terminserien anlegen, Bestätigung senden, Zuzahlungsrechnungen je Fahrt.", "krankenfahrt.html?embedded=1", true);
  return ansichtUebersicht(noch);
}
window.addEventListener("hashchange", route);

// Eingebettete Masken melden ihre Höhe, damit der Rahmen mitwächst.
window.addEventListener("message", (ev) => {
  if (!ev.data || ev.data.type !== "lt-hoehe") return;
  document.querySelectorAll("iframe.maske").forEach((f) => { if (f.contentWindow === ev.source) f.style.height = Math.max(300, ev.data.hoehe + 8) + "px"; });
});

// ===================== ANSICHT: ÜBERSICHT =====================
async function ansichtUebersicht(noch){
  $("main").innerHTML = `<h2 class="seite">Übersicht</h2><p class="unter">Was heute zu tun ist.</p><div class="laden">Wird geladen …</div>`;
  try {
    const [d, kf] = await Promise.all([
      api("buchungenListe", { limit: 1 }),
      portal.module.krankenfahrten ? api("krankenfahrtLaden", { liste: true }).catch(() => null) : Promise.resolve(null)
    ]);
    if (!noch()) return;
    const z = d.zaehler;
    const karte = (zahl, text, ziel, hervor) => `<a class="karte${hervor && zahl > 0 ? " hervor" : ""}" href="${ziel}"><div class="zahl">${zahl}</div><div class="text">${esc(text)}</div></a>`;
    let html = `<h2 class="seite">Übersicht</h2><p class="unter">Was heute zu tun ist.</p><div class="karten">` +
      karte(z.angefragt, "Neue Anfragen", "#/auftraege?status=angefragt", true) +
      karte(z.heute, "Fahrten heute", "#/auftraege?status=heute", false) +
      karte(z.kommend, "Kommende bestätigte Fahrten", "#/auftraege?status=bestaetigt&zeit=kommend", false) +
      karte(z.angebot, "Offene Angebote", "#/auftraege?status=angebot", false) +
      karte(z.zuFakturieren, "Gefahren, Rechnung fehlt", "#/auftraege?status=zu_fakturieren", true);
    if (kf && kf.liste) {
      const offen = kf.liste.reduce((s, a) => s + (a.offen || 0), 0);
      html += karte(offen, "Krankenfahrten: offene Zuzahlungsrechnungen", "#/krankenfahrten", true);
    }
    html += `</div><div class="aktionen">`;
    if (portal.module.neuerAuftrag) html += `<a class="knopf gold" href="#/neu">Neuer Auftrag</a>`;
    if (portal.module.krankenfahrten) html += `<a class="knopf" href="#/krankenfahrten">Krankenfahrt anlegen</a>`;
    if (portal.module.auftraege) html += `<a class="knopf" href="#/auftraege">Alle Aufträge</a>`;
    html += `</div>`;
    $("main").innerHTML = html;
  } catch (e) { if (noch()) $("main").innerHTML = `<h2 class="seite">Übersicht</h2><div class="meldung error">${esc(e.message)}</div>`; }
}

// ===================== ANSICHT: AUFTRÄGE =====================
let suchTimer = null;
async function ansichtAuftraege(params, noch){
  const status = params.get("status") || "alle", zeit = params.get("zeit") || "alle", suche = params.get("suche") || "";
  const opt = (wert, text, aktiv) => `<option value="${wert}" ${wert === aktiv ? "selected" : ""}>${esc(text)}</option>`;
  $("main").innerHTML = `<h2 class="seite">Aufträge</h2><p class="unter">Suchen, filtern und einen Auftrag öffnen.</p>
    <div class="filter">
      <input type="search" id="fSuche" placeholder="Suche: Name, Referenz, E-Mail, Ort, Rechnungsnummer" value="${esc(suche)}">
      <select id="fStatus">${opt("alle", "Alle (ohne stornierte)", status)}${opt("angefragt", "Neue Anfragen", status)}${opt("angebot", "Offene Angebote", status)}${opt("bestaetigt", "Bestätigt", status)}${opt("heute", "Heute", status)}${opt("zu_fakturieren", "Rechnung fehlt", status)}${opt("storniert", "Storniert", status)}</select>
      <select id="fZeit">${opt("alle", "Alle Zeiten", zeit)}${opt("kommend", "Kommende", zeit)}${opt("vergangen", "Vergangene", zeit)}</select>
    </div>
    <div id="listeBox"><div class="laden">Wird geladen …</div></div>`;
  let abfrageNr = 0;
  const aktuell = () => ({ status: $("fStatus").value, zeit: $("fZeit").value, suche: $("fSuche").value.trim() });
  const neuLaden = () => {
    const a = aktuell(), p = new URLSearchParams();
    if (a.status !== "alle") p.set("status", a.status);
    if (a.zeit !== "alle") p.set("zeit", a.zeit);
    if (a.suche) p.set("suche", a.suche);
    const q = p.toString();
    history.replaceState(null, "", "#/auftraege" + (q ? "?" + q : ""));   // Adresse mitführen, ohne die Ansicht neu zu bauen
    listeLaden();
  };
  $("fStatus").addEventListener("change", neuLaden);
  $("fZeit").addEventListener("change", neuLaden);
  $("fSuche").addEventListener("input", () => { clearTimeout(suchTimer); suchTimer = setTimeout(neuLaden, 350); });
  async function listeLaden(){
    const nr = ++abfrageNr, a = aktuell();
    try {
      const d = await api("buchungenListe", { status: a.status, zeit: a.zeit, suche: a.suche, limit: 100 });
      if (!noch() || nr !== abfrageNr) return;   // veraltete Antwort
      // Hinweis auf ausgeblendete stornierte Aufträge (nur bei "Alle"); der Link schaltet den Filter um
      const stornoHinweis = d.ausgeblendet ? ` ${d.ausgeblendet} stornierte${d.ausgeblendet === 1 ? "r Auftrag" : " Aufträge"} ausgeblendet · <a href="#" data-storno>anzeigen</a>` : "";
      const stornoLink = () => { const a = $("listeBox").querySelector("[data-storno]"); if (a) a.addEventListener("click", (ev) => { ev.preventDefault(); $("fStatus").value = "storniert"; neuLaden(); }); };
      if (!d.liste.length) { $("listeBox").innerHTML = `<div class="tabellenrahmen"><div class="leer">Keine Aufträge gefunden.${stornoHinweis ? `<div class="klein" style="margin-top:6px;">${stornoHinweis}</div>` : ""}</div></div>`; stornoLink(); return; }
      $("listeBox").innerHTML = `<div class="tabellenrahmen"><table><thead><tr><th>Fahrt</th><th>Referenz</th><th>Kunde</th><th>Strecke</th><th>Preis</th><th>Status</th></tr></thead><tbody>` +
        d.liste.map((r) => `<tr data-ref="${esc(r.referenz)}">
          <td>${esc(zeitText(r.zeitpunktISO))}</td>
          <td><strong>${esc(r.referenz)}</strong><div class="klein">${r.quelle === "pauschal" ? "Pauschal" : "Online"}</div></td>
          <td>${esc(r.name || "–")}${r.firma ? `<div class="klein">${esc(r.firma)}</div>` : ""}</td>
          <td>${esc(r.von)} → ${esc(r.nach)}</td>
          <td>${r.preisBrutto == null ? "–" : esc(eur(r.preisBrutto))}</td>
          <td>${statusBadge(r.status)}${r.rechnungsnummer ? `<div class="klein">${esc(r.rechnungsnummer)}</div>` : ""}</td></tr>`).join("") +
        `</tbody></table></div>` + (d.gesamt > d.liste.length ? `<p class="klein" style="margin-top:8px;">${d.liste.length} von ${d.gesamt} Treffern angezeigt. Bitte die Suche eingrenzen.${stornoHinweis ? " ·" + stornoHinweis : ""}</p>` : `<p class="klein" style="margin-top:8px;">${d.gesamt} Aufträge${stornoHinweis ? " ·" + stornoHinweis : ""}</p>`);
      stornoLink();
      document.querySelectorAll("#listeBox tbody tr").forEach((tr) => tr.addEventListener("click", () => { location.hash = "#/auftrag/" + encodeURIComponent(tr.dataset.ref); }));
    } catch (e) { if (noch() && nr === abfrageNr) $("listeBox").innerHTML = `<div class="meldung error">${esc(e.message)}</div>`; }
  }
  listeLaden();
}

// ===================== ANSICHT: EINZELNER AUFTRAG =====================
async function ansichtAuftrag(referenz, noch){
  $("main").innerHTML = `<a class="zurueck" href="#/auftraege">← Zurück zu den Aufträgen</a><div class="laden">Wird geladen …</div>`;
  async function laden(){
    try {
      const d = await api("buchungAdminLaden", { referenz });
      if (!noch()) return;
      const k = d.kunde || {}, f = d.fahrt || {};
      const name = k.typ === "firma" ? `${k.firmenname || ""}` : `${k.anrede || ""} ${k.name || ""}`.trim();
      const knoepfe = [];
      if (d.status === "angefragt") { knoepfe.push(["bestaetigen", "Bestätigen", "gold"]); knoepfe.push(["ablehnen", "Ablehnen", "rot"]); }
      if (d.status === "bestaetigt") { knoepfe.push(["ablehnen", "Stornieren", "rot"]); }
      if (d.status === "angebot") { knoepfe.push(["ablehnen", "Angebot stornieren", "rot"]); }
      $("main").innerHTML = `<a class="zurueck" href="#/auftraege">← Zurück zu den Aufträgen</a>
        <h2 class="seite">${esc(d.referenz)} – ${esc(name || "Auftrag")}</h2>
        <div class="kopfkarte">${statusBadge(d.status)} ${d.rechnungsnummer ? `<span class="badge ok">Rechnung ${esc(d.rechnungsnummer)}</span>` : ""}<br>
          ${esc(f.von)} → ${esc(f.nach)}<br>
          ${esc(zeitText(f.zeitpunktISO, true))}${d.preisBrutto != null ? " · " + esc(eur(d.preisBrutto)) : ""}${f.beschreibung ? `<br><span class="klein">${esc(f.beschreibung)}</span>` : ""}</div>
        ${knoepfe.length ? `<div class="werkzeuge">${knoepfe.map(([a, t, c]) => `<button class="knopf ${c}" data-aktion="${a}">${esc(t)}</button>`).join("")}</div>
          <div class="klein" id="aktionHinweis">Die Aktion öffnet sich in einem neuen Tab. Danach wird dieser Auftrag automatisch aktualisiert.</div>` : ""}
        ${(d.status === "bestaetigt" || d.rechnungsnummer) ? `<div class="rahmenkarte"><h3>Rechnung</h3>
          <iframe class="maske" src="rechnung.html?embedded=1&referenz=${encodeURIComponent(d.referenz)}" title="Rechnung"></iframe></div>` : ""}
        <div class="rahmenkarte"><h3>Kontaktdaten, Rechnungsadresse, „Rechnung auf Firma“ und Sprache ändern</h3>
          <iframe class="maske" src="auftrag.html?embedded=1&referenz=${encodeURIComponent(d.referenz)}" title="Auftrag ändern"></iframe></div>`;
      document.querySelectorAll("[data-aktion]").forEach((b) => b.addEventListener("click", () => aktionAusfuehren(d.referenz, b.dataset.aktion, b.textContent, d.rechnungsnummer, d.status)));
    } catch (e) { if (noch()) $("main").innerHTML = `<a class="zurueck" href="#/auftraege">← Zurück zu den Aufträgen</a><div class="meldung error">${esc(e.message)}</div>`; }
  }
  await laden();
  // Kommt man aus dem Aktions-Tab zurück, wird der Auftrag neu geladen.
  const beiFokus = () => { if (noch() && window.__aktionOffen) { window.__aktionOffen = false; laden(); } };
  window.removeEventListener("focus", window.__fokusAuftrag || (() => {}));
  window.__fokusAuftrag = beiFokus;
  window.addEventListener("focus", beiFokus);
}
async function aktionAusfuehren(referenz, aktion, beschriftung, rechnungsnummer, status){
  if (aktion === "ablehnen" && status === "angebot") {
    if (!confirm(`${beschriftung}? Der Kunde wird nicht benachrichtigt.`)) return;
  } else if (aktion === "ablehnen") {
    const hinweis = rechnungsnummer ? `\n\nAchtung: Zu diesem Auftrag gibt es die gültige Rechnung ${rechnungsnummer}. Sie bleibt bestehen. Bitte im Bereich „Rechnung“ eine Stornorechnung erstellen, falls nicht gefahren wird.` : "";
    if (!confirm(`${beschriftung}? Der Kunde wird informiert und der Kalendereintrag entfernt.${hinweis}`)) return;
  }
  const fenster = window.open("", "_blank");
  try {
    const d = await api("buchungAdminLink", { referenz, aktion });
    window.__aktionOffen = true;
    if (fenster) fenster.location.href = d.url; else window.open(d.url, "_blank");
  } catch (e) {
    if (fenster) fenster.close();
    const h = $("aktionHinweis"); if (h) { h.textContent = e.message; h.style.color = "var(--err)"; }
  }
}

// ===================== ANSICHT: EINGEBETTETE MASKE =====================
function ansichtRahmen(titel, unter, adresse, vollbreit){
  $("main").innerHTML = `<h2 class="seite">${esc(titel)}</h2><p class="unter">${esc(unter)}</p>
    <div class="rahmenkarte" style="padding-top:18px;"><iframe class="maske" src="${esc(adresse)}" title="${esc(titel)}"></iframe></div>`;
}

// ===================== START =====================
(async function start(){
  if (!Auth.lesen()) return zeigeLogin("");
  try { await portalStarten(); }
  catch (e) { Auth.loeschen(); zeigeLogin(e.message === "Nicht angemeldet." ? "Die Sitzung ist nicht mehr gültig. Bitte neu anmelden." : e.message); }
})();
</script>
